server {
    listen 80;
    server_name moimmoim.co.kr www.moimmoim.co.kr;

    # Certbot이 도메인 소유권을 검증할 때 접근하는 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 80포트 접속(일반 HTTP 요청)은 HTTPS로 자동 전환
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# 2. HTTPS 443 포트 설정 (실제 서비스 운영)
# ==========================================
server {
    listen 443 ssl;
    server_name moimmoim.co.kr www.moimmoim.co.kr;

    # SSL 인증서 경로
    ssl_certificate /etc/letsencrypt/live/moimmoim.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moimmoim.co.kr/privkey.pem;

    # 프론트엔드 정적 파일 서빙
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API 프록시 설정
    location /api {
        # 백엔드 컨테이너 이름 : 포트
        proxy_pass http://moim-backend:8080;

        proxy_http_version 1.1;
        
        # SSE 연결 유지를 위해 HTTP/1.1 + keep-alive 사용
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE를 위한 최소한의 버퍼링 해제
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}